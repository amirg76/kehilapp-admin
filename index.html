<!DOCTYPE html>
<!-- dir="rtl" is the root fix for this panel's layout, not a cosmetic attribute.
     Every string in this application is Hebrew, but the document itself was
     left-to-right: measured in a real browser at 1280px, `document.documentElement.dir`
     was absent and `getComputedStyle(body).direction` was "ltr", so the shell's
     flex row laid the sidebar out at left 20 / right 256 and pushed the table to
     left 297. The per-component `direction: rtl` rules in the SCSS only ever
     reached text inside each component; the shell that positions them never
     inherited it. Declaring it here makes the browser flow the whole layout —
     and every logical property (margin-inline-*, border-inline-start, inset-inline)
     the stylesheets already use — in the direction the content is actually read. -->
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="לוח הניהול של Kehilapp — הודעות, משתמשים ואישור חברים" />
    <title>Kehilapp — לוח ניהול</title>
    <!-- Heebo is the addition, and it is the reason this page is in Hebrew at
         all: Inter has no Hebrew glyphs, so every Hebrew word here was being
         rendered by whatever fallback the OS chose, next to Latin words drawn
         in Inter. Heebo is a Hebrew face built on Roboto's Latin, so the two
         scripts finally share a rhythm.
         Same host and same request as before — nothing new is being contacted.
         The nine Inter weights were cut to the four this app actually uses;
         display=swap keeps text visible while the font loads. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
